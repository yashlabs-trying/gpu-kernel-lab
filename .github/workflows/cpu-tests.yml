name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[cpu,llama]"
          python -m pip install fastapi "uvicorn[standard]" httpx psutil ninja ruff
      - name: Validate schemas and compile Python
        run: |
          python -m compileall -q kernellab models/optimized-llama
          python -m json.tool schemas/benchmark-result-v2.schema.json >/dev/null
          python -m json.tool models/optimized-llama/quality/prompts.json >/dev/null
      - name: Run CPU suite
        run: pytest -q -m "not gpu and not integration"
      - name: Static analysis
        run: ruff check kernellab tests models/optimized-llama/benchmarks models/optimized-llama/quality models/optimized-llama/kernels models/optimized-llama/profiling models/optimized-llama/scripts
      - name: CLI smoke tests
        run: |
          kernellab models
          kernellab doctor
          kernellab plan --concurrency 1 --input-lengths 8 --output-lengths 32
          kernellab serve llama-3.2-3b --dry-run
